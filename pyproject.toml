[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tic-identity-python"
version = "0.2.1"
description = "Unofficial Python client for TIC Identity (id.tic.io) — BankID authentication and digital signing"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Liam Lenholm" }]
keywords = ["bankid", "authentication", "signing", "e-id", "sweden", "tic-identity"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "websockets>=13.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "ruff>=0.15",
    "mypy>=1.15",
]

[project.urls]
Repository = "https://github.com/liamlenholm/tic-identity-python"
Documentation = "https://github.com/liamlenholm/tic-identity-python#readme"
Issues = "https://github.com/liamlenholm/tic-identity-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/tic"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
